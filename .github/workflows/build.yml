name: Build EXE

on:
  workflow_dispatch:   # Cho phép chạy thủ công từ tab Actions

jobs:
  build:
    runs-on: windows-latest   # Runner Windows để build .exe
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile anti_standby.py

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: anti-standby-exe
          path: dist/anti_standby.exe
