name: Build EXE													

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --clean --onefile anti_standby.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: anti-standby-exe
          path: dist/anti_standby.exe
